project: example-support-agent
dataset: examples/example-support-agent/dataset.jsonl
runner: "python examples/example-support-agent/run_for_eval.py"
scorers:
  - name: exact_match_check
    type: exact_match
    weight: 1.0
    is_critical: true
gate:
  mode: block
  min_mean_score:
    exact_match: 0.95
  max_regression_delta: 0.05
  critical_tags: ["critical"]
