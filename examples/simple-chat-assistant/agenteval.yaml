project: simple-chat-assistant
dataset: examples/simple-chat-assistant/dataset.jsonl
runner: "examples.simple_chat_assistant.run_wrapper:main"
scorers:
  - name: contains_check
    type: contains
    weight: 1.0
    is_critical: true
gate:
  mode: block
  min_mean_score:
    contains: 0.8
  max_regression_delta: 0.1
