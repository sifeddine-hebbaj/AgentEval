[project]
name = "agenteval"
version = "0.1.0"
description = "Open-source agent evaluation and regression testing framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6,<3",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
sdk = ["httpx>=0.27", "mistralai>=1.0"]
cli = ["typer>=0.12", "rich>=13.7", "pyyaml>=6.0", "httpx>=0.27", "mistralai>=1.0", "python-dotenv>=1.0"]
judge-openai = ["openai>=1.30"]
judge-anthropic = ["anthropic>=0.30"]
judge-mistral = ["mistralai>=1.0"]
judge-local = ["httpx>=0.27"]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "celery>=5.4",
    "slowapi>=0.1.9",
    "boto3>=1.34",
    "pydantic-settings>=2.0",
    "email-validator>=2.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
]

[project.scripts]
agenteval = "agenteval_cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agenteval_core*", "agenteval_api*", "agenteval_worker*", "agenteval_sdk*", "agenteval_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "PLW1510"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["union-attr", "arg-type", "call-arg", "misc", "assignment", "has-type", "call-overload", "attr-defined"]
