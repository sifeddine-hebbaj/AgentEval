name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,api,cli,sdk,judge-openai,judge-anthropic,judge-local]"
      - name: Ruff
        working-directory: backend
        run: ruff check .
      - name: mypy (core)
        working-directory: backend
        run: mypy agenteval_core
      - name: Unit tests
        working-directory: backend
        run: PYTHONPATH=. pytest tests/unit -v --cov=agenteval_core --cov-report=term-missing

  backend-integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agenteval
          POSTGRES_USER: agenteval
          POSTGRES_PASSWORD: agenteval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agenteval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://agenteval:agenteval@localhost:5432/agenteval
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,api,cli,sdk,judge-openai,judge-anthropic,judge-local]"
      - name: Run migrations
        working-directory: backend
        run: PYTHONPATH=. alembic upgrade head
      - name: Start Celery worker
        working-directory: backend
        run: PYTHONPATH=. celery -A agenteval_worker.tasks:celery_app worker --loglevel=info --pool=solo &
      - name: Wait for worker
        run: sleep 3
      - name: Integration tests
        working-directory: backend
        run: PYTHONPATH=. pytest tests/integration -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: frontend
        run: npm install --no-audit --no-fund
      - working-directory: frontend
        run: npx tsc -b
      - working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-lint-and-unit-tests, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t agenteval-api:ci ./backend
      - name: Build worker image
        run: docker build -t agenteval-worker:ci -f ./backend/Dockerfile.worker ./backend
      - name: Build frontend image
        run: docker build -t agenteval-frontend:ci ./frontend

  dogfood-example-agent:
    runs-on: ubuntu-latest
    needs: [backend-lint-and-unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - working-directory: backend
        run: pip install -e ".[cli,sdk]"
      - name: Run AgentEval against its own example agent
        run: PYTHONPATH=backend python -m agenteval_cli.main run --config examples/example-support-agent/agenteval.yaml --local --gate
